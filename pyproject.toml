[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smarteduquest"
version = "1.0.0"
description = "AI-powered educational assessment platform for middle school students"
dependencies = [
    "streamlit",
    "PyMuPDF",
    "reportlab",
    "Pillow",
    "pandas",
    "numpy"
]